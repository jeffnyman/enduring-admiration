# On every push and pull request: build bible.db and run scripts/check.sh --full on Linux, package
# the release zip, then start that zip on Linux, Windows and macOS (oldest supported Node and
# current LTS) and run the browser smoke test against it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, check and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The source files are pinned by commit in the pipeline, so they can be cached between runs
      # (this also spares the upstream hosts).
      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: data/cache
          key: sources-${{ hashFiles('pipeline/**/*.py', 'pipeline/*.txt', 'pipeline/*.tsv') }}
          restore-keys: sources-

      - name: Set up
        run: |
          python -m venv .venv
          (cd web && npm ci --no-audit --no-fund)

      - name: Full build and checks
        run: scripts/check.sh --full

      - name: Build report
        if: always()
        run: |
          [[ -f data/build_report.md ]] && cat data/build_report.md >>"$GITHUB_STEP_SUMMARY" || true

      - name: Package the release zip
        run: scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: dist/bible-reader-*.zip
          compression-level: 0
          retention-days: 7

  test-package:
    name: Release zip on ${{ matrix.os }}, Node ${{ matrix.node }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.13.0", "24"]
        include:  # temporary: find the oldest Node whose SQLite has FTS5
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "23" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: ${{ runner.temp }}/zip

      - name: Find the zip
        id: zip
        shell: bash
        run: echo "path=$(ls "$RUNNER_TEMP"/zip/bible-reader-*.zip | head -1)" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/test-package
        with:
          zip: ${{ steps.zip.outputs.path }}
